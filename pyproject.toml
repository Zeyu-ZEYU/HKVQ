[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hack-kv"
version = "1.0.0"
description = "HACK: homomorphic acceleration via compression of the KV cache for disaggregated LLM inference"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch==2.13.0",
    "triton==3.7.1",
    "transformers==5.17.0",
    "numpy==2.3.5",
]

[project.optional-dependencies]
vllm = [
    "vllm==0.29.0",
    "aiohttp==3.14.3",
    "fastapi==0.136.3",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
]
benchmarks = [
    "datasets==5.0.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "rouge-score==0.1.2",
]
test = ["pytest==9.1.1"]

[project.entry-points."vllm.general_plugins"]
hack_attention = "hack.vllm_plugin:register"

[tool.setuptools.packages.find]
include = ["hack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
